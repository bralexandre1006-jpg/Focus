name: Construire Focus natif

# Version native en chantier : ne remplace JAMAIS la release « apk » de l'app actuelle.
on:
  push:
    paths:
      - 'native/**'
      - '.github/workflows/build-native.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Compiler l'APK natif
        working-directory: native
        run: |
          chmod +x gradlew
          for i in 1 2 3; do ./gradlew --no-daemon assembleDebug && exit 0; echo "Essai $i raté"; sleep 20; done; exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: Focus-Native-APK
          path: native/app/build/outputs/apk/debug/app-debug.apk

      - name: Publier l'APK natif (lien direct, release séparée)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp native/app/build/outputs/apk/debug/app-debug.apk FocusNative.apk
          gh release delete native-apk -y --cleanup-tag -R ${{ github.repository }} || true
          gh release create native-apk FocusNative.apk -R ${{ github.repository }} --prerelease --title "Focus natif (chantier)" --notes "Version native en cours, s'installe à côté de l'app actuelle" --target ${{ github.sha }}
