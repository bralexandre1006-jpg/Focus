name: Construire Focus PC

on:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installer
        run: npm install --no-audit --no-fund
      - name: Clé IA du coach
        shell: bash
        env:
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY }}
        run: if [ -n "$ANTHROPIC_KEY" ]; then sed -i "s|__ANTHROPIC_KEY__|$ANTHROPIC_KEY|" src/app.js; fi
      - name: Compiler l'installateur Windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --publish never
      - name: Publier (lien direct)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete pc -y --cleanup-tag -R ${{ github.repository }} || true
          gh release create pc dist/Focus-Setup.exe -R ${{ github.repository }} --title "Focus PC (dernière version)" --notes "Installateur Windows" --target ${{ github.sha }} --prerelease
