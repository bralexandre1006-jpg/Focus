<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://*.firebasedatabase.app https://*.firebaseio.com; style-src 'self' 'unsafe-inline'; font-src 'self'">
<style>
@font-face{font-family:Jakarta;src:url(fonts/jakarta700.ttf);font-weight:700}
@font-face{font-family:Jakarta;src:url(fonts/jakarta800.ttf);font-weight:800}
:root{--acc:#D7FF3A;--acc2:#7BE07E;--tint:#D7FF3A}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:transparent;overflow:hidden}
body{font-family:Jakarta,"Segoe UI",sans-serif;font-weight:700;color:#fff;user-select:none;-webkit-font-smoothing:antialiased;padding:8px}
svg{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.num{font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;white-space:nowrap}

/* verre liquide : verre teinté, reflet, bord lumineux qui capte la lumière */
.g{position:relative;width:100%;height:100%;border-radius:28px;overflow:hidden;-webkit-app-region:drag;padding:16px 18px;isolation:isolate;
  background:
    radial-gradient(120% 80% at 0% 0%,rgba(255,255,255,.22),transparent 55%),
    radial-gradient(90% 90% at 100% 110%,color-mix(in srgb,var(--tint) 38%,transparent),transparent 60%),
    linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.02) 50%,rgba(255,255,255,.06)),
    rgba(14,14,20,.46);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.55),inset 0 -10px 24px rgba(0,0,0,.18),inset 0 12px 24px rgba(255,255,255,.05);
  animation:in .55s cubic-bezier(.2,.9,.3,1.15) both;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.g::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.2px;pointer-events:none;z-index:2;
  background:linear-gradient(135deg,rgba(255,255,255,.75),rgba(255,255,255,.08) 35%,rgba(255,255,255,0) 55%,color-mix(in srgb,var(--tint) 60%,transparent) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.g::before{content:"";position:absolute;left:8%;right:30%;top:-30%;height:55%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.22),transparent);filter:blur(6px);pointer-events:none;z-index:0}
body:hover .g{transform:scale(1.015)}
@keyframes in{from{opacity:0;transform:scale(.9) translateY(6px)}to{opacity:1;transform:none}}
.g>*{position:relative;z-index:1}
.x{position:absolute;top:14px;right:14px;z-index:5;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.4);color:#fff;font:800 11px Jakarta;opacity:0;transition:opacity .2s;cursor:pointer;-webkit-app-region:no-drag}
body:hover .x{opacity:.9}
body.locked .g{-webkit-app-region:no-drag}body.locked .x{display:none}
.t{display:flex;align-items:center;gap:7px;font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:rgba(255,255,255,.78)}
.t i{width:6px;height:6px;border-radius:50%;background:var(--tint);box-shadow:0 0 8px var(--tint)}
.big{font-size:34px;line-height:1;text-shadow:0 2px 12px rgba(0,0,0,.25)}
.big small{font-size:14px;font-weight:700;color:rgba(255,255,255,.65);letter-spacing:-.01em;margin-left:4px}
.sub{font-size:11.5px;color:rgba(255,255,255,.7);margin-top:5px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:8px;font-size:11px;font-weight:800;background:rgba(255,255,255,.12)}
.pill.ok{color:#7DF0A8;background:rgba(61,220,132,.18)}.pill.bad{color:#FF9AA8;background:rgba(255,77,106,.18)}
.bar{display:block;height:7px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.2)}
.bar i{display:block;height:100%;border-radius:4px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.sr{display:flex;flex-direction:column;align-items:center;justify-content:center;height:calc(100% - 14px);gap:2px}
.ring{position:relative;width:118px;height:118px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .big{font-size:25px}
.ring small{font-size:10px;color:rgba(255,255,255,.65);margin-top:3px}
.kc{display:flex;align-items:center;gap:16px;margin-top:12px}
.kc .mini{width:74px;height:74px;position:relative;flex-shrink:0}
.kc .mini svg{width:100%;height:100%;transform:rotate(-90deg)}
.kc .mini b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px}
.macs{display:flex;flex-direction:column;gap:7px;flex:1}
.macs div{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;gap:8px;font-size:11px;color:rgba(255,255,255,.72)}
.macs b{font-size:12px;color:#fff;text-align:right}
.wk{display:flex;align-items:flex-end;gap:8px;height:92px;margin-top:10px}
.wk div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.wk i{width:100%;border-radius:10px;background:linear-gradient(rgba(255,255,255,.30),rgba(255,255,255,.14));min-height:10px;transition:height 1s cubic-bezier(.2,.8,.2,1);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.wk i.ok{background:linear-gradient(color-mix(in srgb,var(--acc) 75%,transparent),color-mix(in srgb,var(--acc) 35%,transparent))}
.wk i.now{background:linear-gradient(var(--acc),var(--acc2));box-shadow:0 0 16px color-mix(in srgb,var(--acc) 70%,transparent),inset 0 1px 0 rgba(255,255,255,.6)}
.wk span{font-size:10px;font-weight:800;color:rgba(255,255,255,.6)}.wk span.now{color:#fff}
.wh{display:flex;justify-content:space-between;align-items:flex-start}
.st{display:flex;align-items:center;gap:14px;height:100%}
.fl{position:relative;width:56px;height:56px;flex-shrink:0;display:grid;place-items:center;border-radius:18px;background:radial-gradient(circle at 50% 60%,rgba(255,138,61,.45),rgba(255,138,61,.08) 70%);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.fl svg{width:32px;height:32px;color:#FFC07A;stroke-width:2.1;filter:drop-shadow(0 0 10px rgba(255,138,61,.9));animation:flick 2.4s ease-in-out infinite;transform-origin:50% 90%}
@keyframes flick{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.06,1.1) rotate(-3deg)}60%{transform:scale(.98,1.04) rotate(2deg)}}
.off{display:grid;place-items:center;height:100%;text-align:center;font-size:12px;color:rgba(255,255,255,.75);line-height:1.4}
</style>
</head>
<body><div class="g" id="g"><div class="off">Connexion…</div></div><button class="x" id="x" title="Masquer">✕</button>
<script src="data.js"></script>
<script src="widget.js"></script>
</body>
</html>
