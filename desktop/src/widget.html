<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://*.firebasedatabase.app https://*.firebaseio.com; style-src 'self' 'unsafe-inline'; font-src 'self'">
<style>
@font-face{font-family:Jakarta;src:url(fonts/jakarta700.ttf);font-weight:700}
@font-face{font-family:Jakarta;src:url(fonts/jakarta800.ttf);font-weight:800}
:root{--acc:#D7FF3A;--acc2:#7BE07E}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:transparent;overflow:hidden}
body{font-family:"Segoe UI Variable Text","Segoe UI",sans-serif;color:#fff;user-select:none;-webkit-font-smoothing:antialiased;padding:6px}
svg{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.num{white-space:nowrap;font-family:Jakarta,sans-serif;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
/* verre liquide : fond translucide, reflets, bord lumineux */
.g{position:relative;width:100%;height:100%;border-radius:26px;overflow:hidden;-webkit-app-region:drag;padding:16px 18px;
  background:linear-gradient(155deg,rgba(255,255,255,.20),rgba(255,255,255,.05) 42%,rgba(255,255,255,.08)),rgba(22,22,28,.42);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(255,255,255,.08),inset 0 0 0 1px rgba(255,255,255,.16);
  animation:in .5s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes in{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.g::before{content:"";position:absolute;inset:-40% -20% auto;height:90%;background:radial-gradient(ellipse at 30% 30%,rgba(255,255,255,.28),transparent 60%);pointer-events:none;transform:rotate(-8deg)}
.g::after{content:"";position:absolute;width:140px;height:140px;right:-50px;bottom:-60px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--tint,var(--acc)) 55%,transparent),transparent 70%);opacity:.55;pointer-events:none}
.g>*{position:relative;z-index:1}
.x{position:absolute;top:10px;right:10px;z-index:3;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.35);color:#fff;font-size:12px;opacity:0;transition:opacity .2s;cursor:pointer;-webkit-app-region:no-drag}
body:hover .x{opacity:.85}
.lab{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:rgba(255,255,255,.75);text-shadow:0 1px 2px rgba(0,0,0,.3)}
.lab svg{width:14px;height:14px;stroke-width:2}
.big{font-size:30px;line-height:1;text-shadow:0 2px 8px rgba(0,0,0,.25)}
.big small{font-family:"Segoe UI",sans-serif;font-size:13px;font-weight:600;color:rgba(255,255,255,.7);letter-spacing:0;margin-left:3px}
.sub{font-size:11px;color:rgba(255,255,255,.7);margin-top:4px;font-weight:600}
.ring{position:relative;width:118px;height:118px;margin:8px auto 0}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .big{font-size:24px}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;border-radius:3px;transition:width .8s}
.macs{display:flex;gap:10px;margin-top:12px}.macs div{flex:1;font-size:11px;color:rgba(255,255,255,.75);font-weight:600}.macs b{display:block;font-size:14px;color:#fff}
.macs i{display:block;height:4px;border-radius:2px;background:rgba(255,255,255,.18);margin-top:4px;overflow:hidden}.macs s{display:block;height:100%;border-radius:2px}
.wk{display:flex;align-items:flex-end;gap:7px;height:96px;margin-top:10px}
.wk div{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.wk i{width:100%;border-radius:8px;background:rgba(255,255,255,.22);min-height:8px;transition:height .8s}
.wk i.on{background:linear-gradient(var(--acc),var(--acc2));box-shadow:0 0 14px color-mix(in srgb,var(--acc) 60%,transparent)}
.wk span{font-size:10px;font-weight:700;color:rgba(255,255,255,.65)}
.row{display:flex;align-items:center;gap:12px;height:100%}
.flame{width:44px;height:44px;color:#FFB15C;filter:drop-shadow(0 0 12px rgba(255,138,61,.7));stroke-width:2}
.off{font-size:12px;color:rgba(255,255,255,.7);margin-top:30px;text-align:center}
</style>
</head>
<body><div class="g" id="g"><div class="off">Connexion…</div></div><button class="x" id="x" title="Masquer">✕</button>
<script src="data.js"></script>
<script src="widget.js"></script>
</body>
</html>
