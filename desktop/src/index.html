<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://*.firebasedatabase.app https://*.firebaseio.com; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'">
<title>Focus</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app" id="app">
  <aside class="side">
    <div class="brand drag" style="height:46px;margin:-14px -12px 12px;padding:0 16px;border-bottom:1px solid var(--line)"><div class="lights"><button class="l-close" data-w="close" data-t="Fermer"></button><button class="l-min" data-w="min" data-t="Réduire"></button><button class="l-max" data-w="max" data-t="Agrandir"></button></div><svg class="logo" viewBox="255 155 535 670"><path d="M305 427 L772 173 L772 290 C772 365 720 427 655 427 Z"/><path d="M272 495 L772 495 L692 578 C648 622 588 642 532 612 L532 808 C522 760 498 705 455 665 Z"/></svg><b>Focus</b><em>PC</em><button class="mini-b" id="miniB" data-t="Réduire la barre"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button></div>
    <div class="sec">Navigation</div>
    <nav id="nav">
      <button data-p="home" class="on"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Aperçu</button>
      <button data-p="hist"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Historique</button>
      <button data-p="steps"><svg viewBox="0 0 24 24"><path d="M4 16c0-3 1.5-6 3.5-6S10 12 10 14s-1 4-3 4-3-.5-3-2zM14 8c0-3 1.5-6 3.5-6S20 4 20 6s-1 4-3 4-3-.5-3-2zM6 21h3M16 13h3"/></svg>Pas<span id="nSteps"></span></button>
      <button data-p="food"><svg viewBox="0 0 24 24"><path d="M7 2v20M4 2v6a3 3 0 0 0 6 0V2M17 22V2c-2.5 1-4 3.5-4 7v5h4"/></svg>Nutrition<span id="nFood"></span></button>
      <button data-p="weight"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="4"/><path d="M8 9a5 5 0 0 1 8 0M12 9l1.5-2"/></svg>Poids</button>
      <button data-p="gym"><svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>Séances<span id="nGym"></span></button>
      <button data-p="duel"><svg viewBox="0 0 24 24"><path d="M14.5 17.5L3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2M9.5 17.5L21 6V3h-3L6.5 14.5M11 19l-6-6M8 16l-4 4M5 21l-2-2"/></svg>Duel</button>
    </nav>
    <div style="flex:1"></div>
    <div class="wdd" id="wdd"><div class="wdd-p" id="wddP"></div><button class="wdd-b" id="wddB"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="5" rx="2"/><rect x="13" y="10" width="8" height="11" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/></svg>Widgets<span id="wddN"></span><svg class="chv" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button></div>
    <div class="me">
      <button class="av" id="av" title="Changer la photo">F</button><div><b id="meName">Focus</b><small id="meSync"><s></s>Hors ligne</small></div>
      <button id="setBtn" title="Réglages"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
    <div class="rsz" id="rsz"></div>
  </aside>
  <main class="main">
    <header class="top drag"><button class="back hidden" id="backB" data-t="Retour"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button><span class="crumb" id="crumb"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><b>Aperçu</b></span><button class="ref" id="refBtn" data-t="Actualiser les données"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.6-4.5M4 4v4h4M4 13a8 8 0 0 0 14.6 4.5M20 20v-4h-4"/></svg>Actualiser</button></header>
    <div class="page" id="page"></div>
  </main>
  <div class="ov hidden" id="ov"></div>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
